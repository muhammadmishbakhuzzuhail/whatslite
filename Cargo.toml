
[package]
name = "wa-rs"
version = "0.2.0"
edition = "2024"
authors = [
    "Fabio Cantone <fabio.cantone@gmail.com>"
]
license = "MIT"
repository = "https://github.com/homunbot/wa-rs"
readme = "README.md"
description = "Async Rust client for WhatsApp Web — fork of whatsapp-rust with stable Rust support"
keywords = ["whatsapp", "chat", "messaging", "signal-protocol"]
categories = ["network-programming", "asynchronous"]

[workspace]
members = [
    ".",
    "bridge",
    "crates/whatslite-mock-backend",
    "crates/whatslite-services",
    "crates/whatslite-wa-adapter",
    "crates/doodle-preview",
    "desktop",
    "http_clients/ureq-client",
    "storages/sqlite-storage",
    "transports/tokio-transport",
    "wacore",
    "wacore/appstate",
    "wacore/binary",
    "wacore/derive",
    "wacore/libsignal",
    "wacore/noise",
    "waproto",
]

[workspace.dependencies]
# Shared dependencies
aes = "0.8.3"
aes-gcm = { version = "0.10.2", default-features = false, features = ["aes", "alloc", "std"] }
anyhow = { version = "1.0", default-features = false }
async-channel = { version = "2.5.0", default-features = false }
async-trait = "0.1.89"
base64 = { version = "0.22.1", default-features = false, features = ["alloc"] }
bon = { version = "3.9.3", default-features = false, features = ["std"] }
buffa = { version = "0.9.2", default-features = false, features = ["json"] }
buffa-build = { version = "0.9.2", default-features = false }
buffa-descriptor = { version = "0.9.2", default-features = false }
bytemuck = { version = "1.22", default-features = false }
bytes = { version = "1.5", default-features = false, features = ["serde"] }
chrono = { version = "0.4", default-features = false }
compact_str = { version = "0.10", default-features = false }
ctr = { version = "0.9", default-features = false }
flate2 = { version = "1.1.5", default-features = false, features = ["zlib-rs"] }
fluent-uri = { version = "0.4.1", default-features = false, features = ["alloc"] }
futures = { version = "0.3", default-features = false, features = ["alloc", "async-await"] }
heck = "0.5"
hex = { version = "0.4", default-features = false, features = ["alloc"] }
hkdf = { version = "0.12.3", default-features = false }
hmac = { version = "0.12.1", default-features = false, features = ["reset"] }
iai-callgrind = "0.16"
log = "0.4"
prost = { version = "0.14.1", default-features = false, features = ["std"] }
prost-build = { version = "0.14.1", default-features = false }
rand = "0.9"
rand_core = "0.10"
serde = { version = "1.0", features = ["derive", "rc"] }
serde-big-array = "0.5"
serde_json = { version = "1.0", default-features = false }
sha2 = { version = "0.10.6", default-features = false }
subtle = "2.6.1"
smallvec = "1.15"
thiserror = "2.0.17"
tokio = { version = "1.48.0", default-features = false }

# Internal workspace crates (upstream-compatible aliases)
wacore = { package = "wa-rs-core", path = "./wacore", version = "0.2.0" }
wacore_appstate = { package = "wa-rs-appstate", path = "./wacore/appstate", version = "0.2.0" }
wacore_binary = { package = "wa-rs-binary", path = "./wacore/binary", version = "0.2.0" }
wacore_derive = { package = "wa-rs-derive", path = "./wacore/derive", version = "0.2.0" }
wacore_libsignal = { package = "wa-rs-libsignal", path = "./wacore/libsignal", version = "0.2.0" }
wacore_noise = { package = "wa-rs-noise", path = "./wacore/noise", version = "0.2.0" }
waproto = { package = "wa-rs-proto", path = "./waproto", version = "0.2.0" }

[features]
debug-snapshots = []
danger-skip-tls-verify = ["wa-rs-tokio-transport?/danger-skip-tls-verify"]
default = ["sqlite-storage", "tokio-transport", "ureq-client", "tokio-native"]
ureq-client = ["dep:wa-rs-ureq-http"]
tokio-transport = ["dep:wa-rs-tokio-transport"]
signal = ["tokio/signal"]
sqlite-storage = ["wa-rs-sqlite-storage"]
tokio-native = ["tokio/rt-multi-thread"]

# Canonical parity features. Edges are added by the task that ports each module.
sqlite-storage-bundled = []
instance-clock = []
legacy-session-interop = []
client-lifecycle = []
plugins = []
passkey = []
mobile-core = ["wacore/mobile"]
mobile-transport-native = []
generated-group-notifications = []
js = []
tracing = []
metrics = []
tracing-pii = []
voip-control = []
voip-runtime = []
voip-engine-wacore = []
voip-relay-native = []
voip = []
voip-encoded = []
voip-mlow = []
voip-libopus = []

# Parity aliases
parity-core = ["instance-clock", "legacy-session-interop"]
parity-messaging = ["parity-core"]
parity-social = ["parity-messaging"]
parity-voip = ["voip"]
parity-mobile = ["mobile-core"]
parity-plugins = ["plugins", "client-lifecycle"]
parity-observability = ["tracing", "metrics"]
parity-wasm = ["js"]

[[bin]]
name = "wa-rs"
path = "src/main.rs"
required-features = ["sqlite-storage", "tokio-transport", "ureq-client", "tokio-native"]

[dependencies]
anyhow = { workspace = true }
async-channel = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }
bon = { workspace = true }
bytes = { workspace = true }
chrono = { workspace = true, features = ["clock", "serde"] }
dashmap = "6.1.0"
env_logger = { version = "0.11", default-features = false }
futures = { workspace = true, features = ["std"] }
hex = { workspace = true }
log = { workspace = true }
moka = { version = "0.12.12", features = ["future"] }
portable-atomic = { version = "1", default-features = false, features = ["fallback"] }
prost = { workspace = true }
rand = { workspace = true }
rand_core = { workspace = true }
scopeguard = "1.2"
serde = { workspace = true }
serde_json = { workspace = true, features = ["std"] }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
wacore = { workspace = true }
wacore_binary = { workspace = true }
waproto = { workspace = true }
wa-rs-sqlite-storage = { path = "./storages/sqlite-storage", version = "0.2.0", optional = true }
wa-rs-tokio-transport = { path = "./transports/tokio-transport", version = "0.2.0", optional = true }
wa-rs-ureq-http = { path = "./http_clients/ureq-client", version = "0.2.0", optional = true }

[dev-dependencies]
qrcode = { version = "0.13", default-features = false }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal"] }
tempfile = "3"
uuid = { version = "1.0", features = ["v4"] }

[[example]]
name = "benchmark"
required-features = ["danger-skip-tls-verify"]

[profile.release]
opt-level = "z"
debug = false
lto = true
codegen-units = 1
panic = "abort"
strip = true
incremental = false

# Benchmark profile: optimized but without aggressive LTO that breaks iai-callgrind
[profile.bench]
inherits = "release"
lto = "thin"
debug = 1
strip = false
