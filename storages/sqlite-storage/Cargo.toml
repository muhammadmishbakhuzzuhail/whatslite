[package]
name = "wa-rs-sqlite-storage"
version = "0.2.0"
edition = "2024"
authors = ["João Lucas <jlucaso@hotmail.com>"]
license = "MIT"
repository = "https://github.com/homunbot/wa-rs"
description = "SQLite storage backend for whatsapp-rust"

[features]
default = ["bundled-sqlite"]
bundled-sqlite = ["libsqlite3-sys/bundled"]
test-util = []
instance-clock = ["wacore/instance-clock"]
js = ["wacore/js"]
mobile = ["wacore/mobile"]
wasm-test = ["js"]

[dependencies]
async-trait = { workspace = true }
bincode = { version = "2.0.1", features = ["serde"] }
diesel = { version = "2.3.5", default-features = false, features = [
    "sqlite",
    "r2d2",
    "32-column-tables",
] }
diesel_migrations = { version = "2.3.1", default-features = false, features = [
    "sqlite",
] }
libsqlite3-sys = { version = "0.35", default-features = false, optional = true }
log = { workspace = true }
prost = { workspace = true }
serde_json = { workspace = true, features = ["std"] }
tokio = { workspace = true, features = ["sync", "rt", "time", "macros"] }
wacore = { workspace = true }
wacore_binary = { workspace = true }
waproto = { workspace = true }

[dev-dependencies]
bytes = { workspace = true }
tokio = { workspace = true, features = ["sync", "rt", "time", "macros"] }

[target.'cfg(all(target_family = "wasm", target_os = "unknown"))'.dependencies]
getrandom = { workspace = true, features = ["wasm_js"] }
