[package]
name = "wa-rs-core"
version = "0.2.0"
edition = "2024"
authors = ["João Lucas <jlucaso@hotmail.com>"]
license = "MIT"
repository = "https://github.com/homunbot/wa-rs"
description = "Core WhatsApp protocol implementation without runtime dependencies"

[features]
default = []
debug-snapshots = []
test-util = []
instance-clock = []
legacy-session-interop = []
tracing = ["dep:tracing"]
metrics = ["dep:metrics"]
tracing-pii = []
js = []
mobile = []
voip-control = []
voip = []
voip-mlow = []

[dependencies]
aes = { workspace = true }
aes-gcm = { workspace = true }
anyhow = { workspace = true }
async-channel = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }
bytes = { workspace = true }
chrono = { workspace = true, features = ["now", "serde"] }
ctr = { workspace = true }
event-listener = { version = "5", default-features = false }
flate2 = { workspace = true }
futures = { workspace = true, features = ["std"] }
hex = { workspace = true }
hkdf = { workspace = true }
hmac = { workspace = true }
log = { workspace = true }
md5 = "0.8.0"
once_cell = { version = "1.19", default-features = false, features = ["std"] }
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
portable-atomic = { version = "1", default-features = false, features = ["fallback"] }
prost = { workspace = true }
protobuf = { version = "3", default-features = false }
rand = { workspace = true }
rand_core = { workspace = true }
serde = { workspace = true }
serde-big-array = { workspace = true }
serde_json = { workspace = true, features = ["std"] }
sha2 = { workspace = true }
thiserror = { workspace = true }
tracing = { version = "0.1", default-features = false, features = ["attributes"], optional = true }
metrics = { version = "0.24", optional = true }
typed-builder = "0.23"
wacore_appstate = { workspace = true }
wacore_binary = { workspace = true, features = ["serde"] }
wacore_derive = { workspace = true }
wacore_libsignal = { workspace = true }
wacore_noise = { workspace = true }
waproto = { workspace = true }

[dev-dependencies]
iai-callgrind = { workspace = true }
futures = { workspace = true, features = ["std", "executor"] }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "time"] }

[[bench]]
name = "reporting_token_benchmark"
harness = false
